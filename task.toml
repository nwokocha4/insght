schema_version = "2.0"
artifacts = ["/app/solve.py"]

[task]
name = "insight/camtrap-diversity"
description = "Extract reported camera-trap mammal diversity values and citation facts from an open-access ecology data paper (TB-Science Science/Ecology; task type EXTRACT)"

# Repository track science-ecology maps to TB-Science taxonomy domain Science, field Ecology.
[metadata]
domain = "Science"
field = "Ecology"
subfield = "camera-trap-diversity"
tags = ["ecology", "cameratrap", "extraction", "published-literature", "biodiversity"]
expert_time_estimate_hours = 2.0
relevant_experience = "reading tables and citation metadata in published ecology papers"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "no-network"
