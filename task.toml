schema_version = "2.0"
artifacts = ["/app/solve.py"]

[task]
name = "insight/camtrap-diversity"
description = "Estimate per-site species diversity from camera-trap images via resnet18 detections with Shannon, Simpson and bias-corrected Chao estimators (TB-Science Science/Ecology; repo track science-ecology)"

# Repository track science-ecology maps to TB-Science taxonomy domain Science, field Ecology.
[metadata]
domain = "Science"
field = "Ecology"
subfield = "camera-trap-diversity"
tags = ["ecology", "cameratrap", "timm", "diversity", "chao", "shannon", "simpson"]
expert_time_estimate_hours = 6.0
relevant_experience = "camera-trap species monitoring with pretrained classifiers and diversity estimators"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
